name: Node.js CI

on:
  push:
    branches: [ Kanchanop6509650229-patch-2 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        os: ['ubuntu:latest', 'centos:latest', 'debian:latest']
        node-version: [18.x, 20.x, 22.x]

    runs-on: self-hosted
    container: ${{matrix.os}}
    
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build  
      run: npm run build --if-present
    - name: Run tests
      run: npm test
